replicaCount: 1

image:
  repository: asia-northeast1-docker.pkg.dev/circleci-demo-484408/circle-demo/cloud-build-image
  tag: latest
  pullPolicy: Always

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  port: 8080

env:
  LOG_LEVEL: "INFO"
  DB_HOST: "dev-db-internal-ip"
  DB_NAME: "test_db"